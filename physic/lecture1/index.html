<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #ffffff;
  }

  /* Header */
  .header {
    background: linear-gradient(90deg, #6a5cff, #7b6cff);
    color: white;
    padding: 16px;
    font-size: 20px;
    font-weight: bold;
  }

  /* Video container */
  .video-wrapper {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: black;
    border-radius: 16px;
    overflow: hidden;
    margin: 16px;
  }

  /* 🔥 MOST IMPORTANT PART */
  video {
    width: 100%;
    height: 100%;
    object-fit: contain;     /* ✅ NO ZOOM / NO CROP */
    background: black;
  }

  /* Info section */
  .info {
    padding: 16px;
  }

  .title {
    font-size: 24px;
    font-weight: bold;
  }

  .subtitle {
    color: #666;
    margin-top: 4px;
  }

  .btn {
    margin-top: 16px;
    padding: 14px;
    width: 100%;
    border: none;
    border-radius: 14px;
    background: #eee9ff;
    color: #6a5cff;
    font-size: 16px;
    font-weight: bold;
  }
</style>
</head>

<body>

<div class="header">Video Player</div>

<div class="video-wrapper">
  <video id="video" controls playsinline></video>
</div>

<div class="info">
  <div class="title">Shzh</div>
  <div class="subtitle">FIRST FLIGHT</div>
  <button class="btn">Fullscreen & Rotate</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
  const video = document.getElementById('video');
  const source = "https://physics-hls2.pages.dev/"; // 🔗 put your Cloudflare Pages m3u8 URL here

  if (Hls.isSupported()) {
    const hls = new Hls();
    hls.loadSource(source);
    hls.attachMedia(video);
  } else {
    video.src = source; // Safari / iOS support
  }
</script>

</body>
</html>
